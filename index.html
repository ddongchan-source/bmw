<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EDEDEB">
<title>My BMW · XREAL M Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Design tokens — Enduring Elegance (Light · App)
   ========================================================= */
:root{
  --bg-canvas:#EDEDEB; --bg-surface:#FAFAF8; --bg-inverse:#0B0B0D; --bg-subtle:#D6D7D9; --bg-track:#C9CACC;
  --text-1:#0B0B0D; --text-2:#5C5F63; --text-3:#8A8D91; --text-inv:#EDEDEB; --text-accent:#16588E;
  --border:#C9CACC; --border-strong:#8A8D91;
  --signal:#81C4FF; --brand:#16588E; --alert:#E7222E; --green:#3DDC84; --amber:#F2A93B;
  --graphite:#1E1F22; --graphite-700:#2A2C30; --silver-200:#B9BBBE;
  --r-sm:10px; --r-md:20px; --r-lg:28px; --r-full:999px; --chamfer:16px;
  --shadow:0 6px 18px rgba(0,0,0,.04);
  --font-en:'Inter',system-ui,-apple-system,sans-serif;
  --font-kr:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font-kr);color:var(--text-1);background:#D9DADC;display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.en{font-family:var(--font-en)}

/* ---------- Device ---------- */
.device{position:relative;width:393px;height:852px;background:var(--bg-canvas);border-radius:54px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.18),0 0 0 10px #111,0 0 0 11px #333}
@media (max-width:520px){body{background:var(--bg-canvas);display:block}.device{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:40;background:linear-gradient(rgba(237,237,235,.92) 70%,rgba(237,237,235,0));display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 44px;pointer-events:none}
.statusbar .time{font:600 17px var(--font-en)}
.statusbar .batt{width:26px;height:13px;border-radius:4px;background:var(--text-1)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:fadeIn .22s ease-out}
.screen.back{animation:fadeBack .22s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes fadeBack{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.scroll{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:108px 24px 128px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll.nohead{padding-top:0}

/* ---------- Header ---------- */
.header{position:absolute;top:0;left:0;right:0;height:108px;z-index:20;background:rgba(237,237,235,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.header .backbtn{position:absolute;left:16px;top:52px;width:44px;height:44px;border-radius:50%;background:var(--bg-surface);border:1px solid var(--border);display:grid;place-items:center}
.header h1{position:absolute;left:0;right:0;top:62px;text-align:center;font-weight:500;font-size:17px;pointer-events:none}
.header .backbtn{z-index:2}

/* ---------- Tab bar (pill nav) ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:96px;z-index:30;background:rgba(237,237,235,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;justify-content:center;gap:6px;padding-top:16px}
.tab{height:52px;min-width:52px;border-radius:var(--r-full);background:var(--bg-surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.tab.active{background:var(--bg-inverse);border-color:var(--bg-inverse);color:var(--text-inv);padding:0 18px 0 16px}
.tab.active span{font-size:14px;font-weight:500}
.tab.disabled{cursor:default}
.homeind{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:135px;height:5px;border-radius:3px;background:var(--text-1);z-index:31}

/* ---------- Type ---------- */
.h1{font-size:22px;font-weight:500;margin:32px 0 14px;display:flex;justify-content:space-between;align-items:baseline}
.h1 .link{font-size:14px;color:var(--text-accent);font-weight:500}
.h1 .meta{font-size:13px;color:var(--text-2);font-weight:400}
.metric-xl{font:300 64px/1 var(--font-en);letter-spacing:-.03em}
.metric-l{font:300 36px/1.05 var(--font-en);letter-spacing:-.02em}
.overline{font:600 12px var(--font-en);letter-spacing:.1em;color:var(--text-2);text-transform:uppercase}
.body2{font-size:13px;color:var(--text-2);line-height:1.55}
.center{text-align:center}

/* ---------- Cards ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px;position:relative}
.card.inverse{background:var(--bg-inverse);border-color:var(--bg-inverse);color:var(--text-inv)}
.card.inverse .sub{color:var(--silver-200)}
.card.sel{border:2px solid var(--bg-inverse)}
button.card{display:block;width:100%;transition:transform .12s}
button.card:active,.qa:active,.btn:active,.row:active{transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub{font-size:12.5px;color:var(--text-2)}
.ar-panel{background:var(--bg-inverse);color:#fff;clip-path:polygon(var(--chamfer) 0,100% 0,100% calc(100% - var(--chamfer)),calc(100% - var(--chamfer)) 100%,0 100%,0 var(--chamfer))}

/* ---------- List rows (no box, 1px line) ---------- */
.list{border-bottom:1px solid var(--border)}
.row{width:100%;display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 0;border-top:1px solid var(--border);transition:background .15s}
.list .row:first-child{border-top:0}
.row .rt{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:500}
.row .s{font-size:12.5px;color:var(--text-2);margin-top:3px}
.row .v{font-size:14px;color:var(--text-2);white-space:nowrap}
.row .v.ok{color:var(--text-accent);font-weight:500}
.row.dim .t,.row.dim svg{color:var(--text-3)}
.chev{color:var(--text-3)}

/* ---------- Controls ---------- */
.toggle{width:52px;height:32px;border-radius:var(--r-full);background:var(--bg-track);position:relative;flex:none;transition:background .2s}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .2s}
.toggle.on{background:var(--brand)}
.toggle.on::after{transform:translateX(20px)}
.radio{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-strong);flex:none;display:grid;place-items:center}
.radio.on{background:var(--bg-inverse);border-color:var(--bg-inverse);color:#fff}
.btn{display:block;width:100%;height:54px;border-radius:var(--r-full);font-size:15px;font-weight:500;text-align:center;transition:transform .12s,opacity .2s}
.btn.primary{background:var(--bg-inverse);color:var(--text-inv)}
.btn.secondary{background:var(--bg-surface);border:1px solid var(--border)}
.btn.text{height:44px;color:var(--text-accent)}
.btn+.btn{margin-top:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.tag{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:var(--r-full);background:var(--bg-surface);border:1px solid var(--border);font-size:12.5px;font-weight:500;white-space:nowrap}
.tag.inv{background:var(--bg-inverse);color:var(--text-inv);border-color:var(--bg-inverse)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--bg-subtle);border-radius:var(--r-full);padding:4px}
.seg button{flex:1;height:36px;border-radius:var(--r-full);font-size:14px;color:var(--text-2);text-align:center;transition:all .2s}
.seg button.on{background:var(--bg-surface);color:var(--text-1);font-weight:500;box-shadow:var(--shadow)}
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.date{height:64px;border-radius:22px;background:var(--bg-surface);border:1px solid var(--border);text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px}
.date small{font-size:12px;color:var(--text-2)}
.date b{font:400 18px var(--font-en)}
.date.on{background:var(--bg-inverse);border-color:var(--bg-inverse);color:var(--text-inv)}
.date.on small{color:var(--silver-200)}
.date.off{opacity:.4;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{height:52px;border-radius:var(--r-full);background:var(--bg-surface);border:1px solid var(--border);text-align:center;display:flex;flex-direction:column;justify-content:center}
.slot b{font:400 15px var(--font-en)}
.slot small{font-size:10.5px;color:var(--text-2)}
.slot.on{background:var(--bg-inverse);color:var(--text-inv);border-color:var(--bg-inverse)}
.slot.on small{color:var(--silver-200)}
.slot.off{opacity:.45;pointer-events:none}
.icbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bg-subtle);border:1px solid var(--bg-surface);position:relative}
.icbtn.inv{background:var(--bg-inverse);color:#fff;border-color:var(--bg-inverse)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--alert);border:1.5px solid var(--bg-inverse)}

/* ---------- Placeholder images ---------- */
.ph{background:var(--bg-subtle);border:1.2px dashed var(--border-strong);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-3);font-size:12px;overflow:hidden;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.has{border:0;background:none}

/* ---------- Home ---------- */
.hero{height:440px;border-radius:0;border-left:0;border-right:0;border-top:0;margin:0 -24px}
.topbar{position:absolute;top:52px;left:24px;right:16px;display:flex;align-items:center;gap:8px;z-index:5}
.topbar .name{flex:1;font:500 20px var(--font-en)}
.fuel{text-align:center;margin-top:12px}
.segbar{display:flex;gap:6px;margin:26px 0 22px}
.segbar i{flex:1;height:5px;border-radius:3px;background:var(--bg-track)}
.segbar i.on{background:var(--signal)}
.qas{display:flex;justify-content:space-between}
.qa{width:56px;text-align:center;font-size:12px;color:var(--text-2);transition:transform .12s}
.qa .c{width:56px;height:56px;border-radius:50%;background:var(--bg-surface);border:1px solid var(--border);display:grid;place-items:center;margin-bottom:8px;color:var(--text-1);box-shadow:var(--shadow);transition:all .2s}
.qa.on .c{background:var(--bg-inverse);color:#fff;border-color:var(--bg-inverse)}
.qa.busy .c{animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.45}}
.mcard{height:182px;display:flex;flex-direction:column;text-align:left}
.mcard .hd{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.mcard .ring{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.4);display:grid;place-items:center}
.mcard .val{margin-top:auto}
.mcard .chev{position:absolute;right:16px;bottom:16px}

/* ---------- Misc ---------- */
.level-dots{position:relative;display:flex;justify-content:space-between;margin:28px 6px 6px}
.level-dots::before{content:'';position:absolute;left:6px;right:6px;top:5px;height:2px;background:var(--graphite-700)}
.level-dots .fill{position:absolute;left:6px;top:5px;height:2px;background:#fff}
.level-dots div{position:relative;width:12px;height:12px;border-radius:50%;background:var(--graphite-700)}
.level-dots div.done{background:#fff}
.level-dots div.cur{width:18px;height:18px;margin-top:-3px;background:#fff;border:3px solid var(--signal)}
.level-lbl{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-3)}
.level-lbl span{width:52px;text-align:center}
.level-lbl span.cur{color:#fff;font-weight:500}
.bar{height:4px;border-radius:2px;background:var(--graphite-700);overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);border-radius:2px}
.done-icon{width:80px;height:80px;border-radius:50%;background:var(--bg-inverse);color:#fff;display:grid;place-items:center;margin:40px auto 24px;box-shadow:var(--shadow)}
.ticket{position:relative;padding:22px 24px}
.ticket .cut{position:absolute;top:190px;width:24px;height:24px;border-radius:50%;background:var(--bg-canvas)}
.qr{width:140px;height:140px;border-radius:16px;background:#fff;display:grid;grid-template-columns:repeat(9,1fr);padding:12px;gap:2px}
.qr i{background:#0B0B0D;border-radius:1px}
.qr i.w{background:#fff}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--bg-surface);font-size:20px;text-align:center}
.timeline .ti{display:flex;gap:16px;position:relative;padding-bottom:22px}
.timeline .ti:last-child{padding-bottom:0}
.timeline .ti::before{content:'';position:absolute;left:69px;top:16px;bottom:-4px;width:1.5px;background:var(--border)}
.timeline .ti:last-child::before{display:none}
.timeline .tm{width:46px;font:500 14px var(--font-en);color:var(--text-2)}
.timeline .pt{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--text-1);background:var(--bg-surface);margin-top:5px;flex:none;z-index:1}
.timeline .pt.on{background:var(--text-1)}
.ladder{position:relative;padding-left:46px}
.ladder::before{content:'';position:absolute;left:12px;top:24px;bottom:24px;width:2px;background:var(--bg-track)}
.ladder .lnode{position:absolute;left:0;width:26px;height:26px;border-radius:50%;background:var(--bg-surface);border:1.5px solid var(--bg-track);display:grid;place-items:center;color:#fff}
.ladder .lnode.done{background:var(--bg-inverse);border-color:var(--bg-inverse)}
.ladder .lnode.next{border:3px solid var(--bg-inverse)}
.ladder .step{position:relative;margin-bottom:16px}
.ladder .lnode{top:20px;left:-46px}
.dbar{position:relative;width:70px;height:6px}
.dbar::before{content:'';position:absolute;left:50%;top:-5px;height:16px;width:1px;background:var(--border-strong)}
.dbar i{position:absolute;top:0;height:6px;border-radius:3px}
.standing{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:22px}
.standing.me{background:var(--bg-subtle)}
.standing .p{width:22px;font:600 16px var(--font-en);text-align:center}
.replay{position:relative;height:190px;overflow:hidden}
.replay svg.track{position:absolute;inset:0;width:100%;height:100%}
.playbtn{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--bg-surface);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:2}
.replay .prog{position:absolute;left:18px;right:18px;bottom:16px;height:3px;border-radius:2px;background:rgba(255,255,255,.2)}
.replay .prog i{display:block;height:100%;width:0;background:var(--signal);border-radius:2px}
.replay .lbl{position:absolute;left:18px;top:16px;font:600 12px var(--font-en);letter-spacing:.1em;color:var(--silver-200)}

/* ---------- Toast ---------- */
.toast{position:absolute;left:24px;right:24px;bottom:112px;z-index:60;background:var(--bg-inverse);color:var(--text-inv);border-radius:var(--r-full);min-height:56px;padding:12px 20px 12px 14px;display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.22);transform:translateY(20px);opacity:0;pointer-events:none;transition:all .25s}
.toast.show{transform:none;opacity:1}
.toast .ti{width:26px;height:26px;border-radius:50%;background:var(--green);color:var(--bg-inverse);display:grid;place-items:center;flex:none}
.toast.warn .ti{background:var(--amber)}
.toast.off .ti{background:var(--graphite-700);color:#fff}

/* ---------- Sheet ---------- */
.scrim{position:absolute;inset:0;z-index:70;background:rgba(11,11,13,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:71;background:var(--bg-canvas);border-radius:28px 28px 0 0;padding:12px 24px 40px;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:86%;overflow-y:auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--bg-track);margin:0 auto 18px}
.sheet h2{font-size:20px;font-weight:500;margin-bottom:6px}
.sheet .desc{font-size:13px;color:var(--text-2);margin-bottom:16px;line-height:1.55}
.sheet .acts{margin-top:22px}
.spinner{width:22px;height:22px;border:2.5px solid var(--bg-track);border-top-color:var(--text-1);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:6px;border-radius:3px;background:var(--bg-track);overflow:hidden;margin:18px 0}
.progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.windshield{position:relative;height:224px;margin-top:20px}
/* ---------- AR driver view (layered images) ---------- */
.arview{position:relative;width:100%;aspect-ratio:16/9;margin-top:20px;cursor:zoom-in;background:#0B0B0D}
.arview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transition:opacity .35s ease}
.arview img.hide{opacity:0}
.arview .schem{display:none;position:absolute;inset:0}
.arview.noimg{aspect-ratio:auto;height:224px}
.arview.noimg img{display:none}
.arview.noimg .schem{display:block}
.arview .arhint{position:absolute;right:12px;bottom:10px;z-index:3;font-size:11px;color:#fff;background:rgba(11,11,13,.55);padding:4px 10px;border-radius:999px;pointer-events:none}
.arview .modetag{position:absolute;left:22px;top:10px;z-index:3;font:600 11px var(--font-en);letter-spacing:.1em;color:#fff;background:rgba(11,11,13,.55);padding:4px 10px;border-radius:999px;pointer-events:none}
.armodal{position:absolute;inset:0;z-index:80;background:#0B0B0D;display:none;align-items:center;justify-content:center}
.armodal.show{display:flex}
.armodal .rot{transform:rotate(90deg);display:flex;flex-direction:column;gap:12px}
.armodal .arview{margin:0;cursor:zoom-out}
.armodal .bigchips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.armodal .bigchips button{height:30px;padding:0 12px;border-radius:999px;border:1px solid #5C5F63;color:#B9BBBE;font-size:12px;font-weight:500}
.armodal .bigchips button.on{background:#81C4FF;border-color:#81C4FF;color:#0B0B0D}
.armodal .bigchips button.fixed{background:#EDEDEB;border-color:#EDEDEB;color:#0B0B0D}
.armodal .close{position:absolute;top:56px;right:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;z-index:2}
.zone{position:absolute;border:1px dashed rgba(255,255,255,.7);border-radius:5px;background:rgba(255,255,255,.06);font:700 10px var(--font-en);color:#fff;padding:2px 4px;text-align:left;transition:all .2s}
.zone.on{background:rgba(129,196,255,.18);border-color:var(--signal)}
.zone.offz{opacity:.3}
.zone.lock{background:rgba(255,255,255,.92);color:#0B0B0D;border-style:solid}
.opt-prev{height:96px;margin-bottom:14px;display:grid;place-items:center}
.flash{animation:flash .9s}
@keyframes flash{30%{background:rgba(129,196,255,.25)}}
</style>
</head>
<body>
<div class="device" id="device">
  <div class="statusbar"><span class="time">9:41</span><span class="batt"></span></div>
  <div id="app"></div>
  <div class="toast" id="toast"><span class="ti" id="toastIcon"></span><span id="toastText"></span></div>
  <div class="scrim" id="scrim" data-a="closeSheet"></div>
  <div class="sheet" id="sheet"></div>
  <div class="armodal" id="armodal"></div>
</div>

<script>
/* =========================================================
   IMAGE SLOTS — 이미지 경로를 넣으면 플레이스홀더 대신 표시됩니다.
   ========================================================= */
const IMAGES = {
  hero: '',          // 차량 히어로 (M4 Competition 정면)
  glasses: '',       // AR 글라스 제품 이미지
  glassesSmall: '',  // XREAL M 허브 상단 글라스
  track: '',         // 영종도 트랙맵 / 서킷 이미지
  simRoom: '',       // 시뮬레이터 룸 이미지
};

/* =========================================================
   AR DRIVER VIEW LAYERS — 화면 구성(E)의 운전자 뷰
   폴더 구조:  ar/circuit/…  ar/road/…  ar/sim/…
   base.jpg  = UI가 없는 운전자 시점 배경

/* =========================================================
   ROUTER + RENDER
   ========================================================= */
let stack=['A'];
const app=document.getElementById('app');
function render(dir){
  const key=stack[stack.length-1];
  const prev=app.querySelector('.scroll');const keep=dir==='same'&&prev?prev.scrollTop:0;
  app.innerHTML=`<div class="screen ${dir==='back'?'back':''}" style="${dir==='same'?'animation:none':''}">${SCREENS[key]()}</div>`;
  const sc=app.querySelector('.scroll');if(sc)sc.scrollTop=keep;
  save();
}
const go=k=>{closeAR();stack.push(k);render();};
const back=()=>{closeAR();if(stack.length>1){stack.pop();render('back');}};
const refresh=()=>render('same');

/* ---------- Toast ---------- */
let tTimer;
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.className='toast '+(type==='ok'?'':type);
  document.getElementById('toastIcon').innerHTML=ic(type==='warn'?'info':type==='off'?'x':'check',16,2.4);
  document.getElementById('toastText').textContent=msg;
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('show'),2300);
}
/* ---------- Sheet ---------- */
let sheetKey=null,sheetArg=null;
function openSheet(k,arg){sheetKey=k;sheetArg=arg;const sh=document.getElementById('sheet');sh.innerHTML=`<div class="grab"></div>`+SHEETS[k](arg);sh.classList.add('show');document.getElementById('scrim').classList.add('show');}
function refreshSheet(){if(sheetKey){const sh=document.getElementById('sheet');const st=sh.scrollTop;sh.innerHTML=`<div class="grab"></div>`+SHEETS[sheetKey](sheetArg);sh.scrollTop=st;}}
function closeSheet(){sheetKey=null;document.getElementById('sheet').classList.remove('show');document.getElementById('scrim').classList.remove('show');}

/* ---------- AR layer sync + landscape preview ---------- */
function syncLayers(){AR_ORDER.forEach(k=>document.querySelectorAll('.layer-'+k).forEach(el=>el.classList.toggle('hide',!layerVisible(k))));
  document.querySelectorAll('.bigchips [data-a="cluster"]').forEach(c=>c.classList.toggle('on',c.dataset.p===S.cluster));}
function openAR(){
  const m=document.getElementById('armodal'),dev=document.getElementById('device');
  const W=Math.min(dev.clientHeight-120,(dev.clientWidth-110)*16/9);
  const zs=Object.entries(ZONES[S.cfgMode]).map(([id,[,t]])=>`<button class="${S.zones[id]?'on':''}" data-a="zone" data-p="${id}">${t.split(' · ')[0]==='G'?'G·H':t.split(' · ')[0]} ${t.split(' · ').slice(-1)[0]}</button>`).join('');
  m.innerHTML=`<button class="close" data-a="arClose">${ic('x',20)}</button><div class="rot" style="width:${W}px"><div style="width:345px;zoom:${(W/345).toFixed(3)}">${arView(S.cfgMode,(id,l,x,y,w,h)=>`<span class="zone ${S.zones[id]?'on':'offz'}" data-p="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${l}</span>`,true)}</div>
    <div class="bigchips"><button class="fixed">A 속도 · 기어</button><button class="fixed">E 안전 알림</button>${zs}<button class="${S.cluster==='shift'?'on':''}" data-a="cluster" data-p="shift">시프트 라이트</button><button class="${S.cluster==='dial'?'on':''}" data-a="cluster" data-p="dial">3원형</button></div></div>`;
  m.classList.add('show');
}
function closeAR(){const m=document.getElementById('armodal');m.classList.remove('show');m.innerHTML='';}

/* =========================================================
   ACTIONS
   ========================================================= */
let busy=false, replayTimer=null;
const A={
  go:p=>go(p), back:()=>back(),
  tab:p=>{stack=[p];render();},
  reset:p=>{stack=p.split(',');render('back');},
  sheet:p=>{const [k,arg]=p.split('|');openSheet(k,arg);},
  sheetGo:p=>{closeSheet();go(p);},
  closeSheet:()=>closeSheet(),
  toastMsg:p=>{const [m,t]=p.split('|');toast(m,t||'ok');},

  /* remote commands on home */
  remote:p=>{
    if(busy)return;busy=true;
    const el=document.getElementById('qa-'+p);if(el)el.classList.add('busy');
    const msgs={lock:['차량이 잠겼습니다','ok'],unlock:['차량 잠금이 해제되었습니다','ok'],light:['라이트를 깜빡였습니다','ok'],horn:['경적을 울렸습니다','ok']};
    if(sheetKey)closeSheet();
    setTimeout(()=>{busy=false;
      if(p==='lock'){if(S.locked){toast('차량이 이미 잠겨 있습니다','warn');refresh();return;}S.locked=true;}
      if(p==='unlock'){if(!S.locked){toast('차량 잠금이 이미 해제되어 있습니다','warn');refresh();return;}S.locked=false;}
      if(p==='climate'){S.climate=!S.climate;refresh();toast(S.climate?`공조가 켜졌습니다 · ${S.climateTemp}°C`:'공조가 꺼졌습니다',S.climate?'ok':'off');return;}
      refresh();toast(...msgs[p]);
    },850);
  },

  /* generic toggle: key|label */
  toggle:p=>{const [k,l]=p.split('|');S[k]=!S[k];
    if(sheetKey)refreshSheet();refresh();
    toast(`${l}${josa(l,'이','가')} ${S[k]?'활성화':'비활성화'}되었습니다`,S[k]?'ok':'off');},
  /* generic pick: key|value|message */
  pick:p=>{const [k,v,m]=p.split('|');S[k]=v;refreshSheet();refresh();if(m){toast(m);setTimeout(closeSheet,350);}},

  notif:p=>{const [k,d]=p.split('|');S.read[k]=true;if(d)go(d);else{refresh();toast('읽음으로 표시했습니다');}},
  readAll:()=>{['n1','n2','n3','n4','n5'].forEach(k=>S.read[k]=true);refresh();toast('모든 알림을 읽음으로 표시했습니다');},

  /* climate sheet */
  temp:p=>{S.climateTemp=Math.min(28,Math.max(16,S.climateTemp+ +p));refreshSheet();},
  climateSave:()=>{closeSheet();refresh();toast(S.climateTimer?`냉난방 타이머 ${S.climateTime} · ${S.climateTemp}°C로 저장되었습니다`:'냉난방 타이머가 꺼져 있습니다',S.climateTimer?'ok':'off');},

  /* glasses */
  software:()=>{toast('업데이트 확인 중…','warn');setTimeout(()=>toast('최신 버전입니다 · XREAL M 2.4.1'),1200);},
  helmet:()=>{S.helmet=!S.helmet;refreshSheet();refresh();toast(S.helmet?'헬멧이 연결되었습니다':'헬멧 연결이 해제되었습니다',S.helmet?'ok':'off');},
  lost:()=>{S.lost=!S.lost;closeSheet();refresh();toast(S.lost?'분실 모드가 켜졌습니다 · 글라스가 잠겼습니다':'분실 모드가 꺼졌습니다',S.lost?'warn':'ok');},
  irisStart:()=>{const b=document.getElementById('irisBtn');b.disabled=true;let v=0;const msg=document.getElementById('irisMsg');const steps=['정면의 점을 바라보세요','왼쪽을 천천히 보세요','오른쪽을 천천히 보세요','다시 정면을 보세요'];
    const t=setInterval(()=>{v+=5;document.getElementById('irisProg').style.width=v+'%';msg.textContent=steps[Math.min(3,Math.floor(v/25))];
      if(v>=100){clearInterval(t);S.irisDate='2026. 11. 22.';closeSheet();refresh();toast('홍채가 다시 등록되었습니다');}},180);},
  asSubmit:()=>{closeSheet();toast(`AS가 접수되었습니다 · 서비스 센터 ${S.center}에서 연락드릴게요`);S.asType=null;},
  lensStep:p=>{const [k,d]=p.split('|');S[k]=Math.round((S[k]+ +d)*100)/100;S[k]=Math.max(-10,Math.min(6,S[k]));refreshSheet();},
  lensSave:()=>{closeSheet();refresh();toast(`새 도수를 적용했습니다 · 좌 ${fmtLens(S.lensL)} · 우 ${fmtLens(S.lensR)}`);},
  lensGo:p=>{if(p==='1')S.withService=true;go('H');},
  center:p=>{S.center=p;refresh();toast(`BMW 서비스 센터 ${p}${josa(p,'을','를')} 선택했습니다`);},
  lensDay:p=>{S.lensDay=+p;refresh();},
  lensTime:p=>{S.lensTime=p;refresh();},
  lensSubmit:()=>{S.lensReq=`${S.center} · 11.${23+S.lensDay} ${S.lensTime}`;go('I');toast('도수 변경이 신청되었습니다');},
  cancelLens:()=>{S.lensReq=null;stack=['A','D','G'];render('back');toast('도수 변경 신청이 취소되었습니다','off');},

  /* screen config */
  cfgMode:p=>{S.cfgMode=p;refresh();toast(`${p} 모드 화면을 편집합니다`);},
  cluster:p=>{if(S.cluster===p)return;S.cluster=p;save();syncLayers();
    const g=document.getElementById('optgrid');
    if(g){const tmp=document.createElement('div');tmp.innerHTML=SCREENS.E();const ng=tmp.querySelector('#optgrid');if(ng)g.innerHTML=ng.innerHTML;}
    toast(`핸들 위 표시를 ${p==='shift'?'시프트 라이트로':'3원형 클러스터로'} 바꿨어요`);},
  zone:p=>{S.zones[p]=!S.zones[p];save();syncLayers();
    const on=S.zones[p];const l=ZONES[S.cfgMode][p][1];
    document.querySelectorAll(`#zr-${p} .toggle`).forEach(t=>t.classList.toggle('on',on));
    document.querySelectorAll(`.zone[data-p="${p}"]`).forEach(z=>{z.classList.toggle('on',on);z.classList.toggle('offz',!on);});
    document.querySelectorAll(`.bigchips [data-p="${p}"]`).forEach(c=>c.classList.toggle('on',on));
    const r=document.getElementById('zr-'+p);if(r){r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash');}
    toast(`${l}${josa(l,'이','가')} ${on?'활성화':'비활성화'}되었습니다`,on?'ok':'off');},
  arFull:()=>openAR(),
  arClose:()=>closeAR(),
  lockedZone:p=>toast(`${p}${josa(p,'은','는')} 안전을 위해 항상 표시됩니다`,'warn'),

  /* coach / ghost */
  coach:p=>{S.coach=p;refresh();toast(`코치 레벨이 ${COACH[p][1]}${josa(COACH[p][1],'으로','로')} 설정되었습니다`);},
  ghost:p=>{const i=S.ghosts.indexOf(p);const n=GHOSTS[p][1];
    if(i>=0){S.ghosts.splice(i,1);refresh();toast(`${n} 고스트를 껐습니다`,'off');return;}
    if(S.ghosts.length>=2){toast('고스트는 최대 2대까지 선택할 수 있어요','warn');return;}
    S.ghosts.push(p);refresh();toast(`${n} 고스트를 켰습니다`);},

  /* simulator booking */
  simDay:p=>{S.simDay=+p;refresh();},
  simSlot:p=>{S.simSlot=p;refresh();},
  simSubmit:()=>{S.simBooking={day:S.simDay,slot:S.simSlot,ghost:S.simGhost,coach:S.simCoach};if(S.ticket>0)S.ticket=0;stack=['C','L'];render();toast('시뮬레이터 예약이 확정되었습니다');},
  cancelSim:()=>{S.simBooking=null;S.ticket=1;closeSheet();stack=['C'];render('back');toast('예약이 취소되었습니다 · 초대권을 돌려드렸어요','off');},

  /* season round */
  joinRound:()=>{S.roundJoined=true;go('N');toast('라운드 3 참가가 확정되었습니다');},
  cancelRound:()=>{S.roundJoined=false;closeSheet();refresh();toast('라운드 3 참가가 취소되었습니다','off');},
  standTab:p=>{S.standTab=p;refresh();},

  /* replay */
  replay:()=>{const btn=document.getElementById('playbtn');if(replayTimer){clearInterval(replayTimer);replayTimer=null;btn.innerHTML=ic('play',24);return;}
    const path=document.getElementById('trk');if(!path)return;const L=path.getTotalLength();let t=0;btn.innerHTML=ic('pause',22);btn.style.opacity='.6';toast('LAP 6 리플레이 · 흰색 이번 랩 / 파란색 내 베스트');
    replayTimer=setInterval(()=>{t+=0.006;if(t>=1){clearInterval(replayTimer);replayTimer=null;btn.innerHTML=ic('play',24);btn.style.opacity='1';t=1;}
      const p1=path.getPointAtLength(L*t),p2=path.getPointAtLength(L*Math.max(0,t-0.025));const c1=document.getElementById('car1'),c2=document.getElementById('car2');
      if(!c1)return;c1.setAttribute('cx',p1.x);c1.setAttribute('cy',p1.y);c2.setAttribute('cx',p2.x);c2.setAttribute('cy',p2.y);document.getElementById('replayProg').style.width=(t*100)+'%';},30);},
  sheetReplay:()=>{closeSheet();setTimeout(()=>A.replay(),300);}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,p=el.dataset.p;
  if(A[a]){e.preventDefault();A[a](p,el);}
});
/* reset demo: long-press status bar time area → double click */
document.querySelector('.statusbar').style.pointerEvents='auto';
document.querySelector('.statusbar .time').addEventListener('dblclick',()=>{try{localStorage.removeItem('xrealM');}catch(e){}S=structuredClone(DEFAULT);stack=['A'];render();toast('데모 상태를 초기화했습니다');});
render();
</script>
</body>
</html>
